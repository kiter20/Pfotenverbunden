<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pfotenverbunden</title>

    <meta name="description" content="Handgemachte Hundeaccessoires mit Liebe gefertigt. Inspiriert von Charly & Fritz.">
    <meta name="robots" content="index, follow">

    <meta property="og:title" content="Pfotenverbunden">
    <meta property="og:description" content="Handgemachte Hundeaccessoires mit Liebe gefertigt.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://www.pfotenverbunden.de/logo-pfotenverbunden.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: #fafafa;
            color: #333;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .logo {
            width: 100%;
            max-width: 320px;
            height: auto;
            margin-bottom: 1.5rem;
        }

        .description {
            max-width: 450px;
            line-height: 1.6;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .instagram-button {
            display: inline-block;
            padding: 1rem 2.2rem;
            background-color: #E1306C;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .instagram-button:hover {
            background-color: #c7255c;
        }

        footer {
            background-color: #eeeeee;
            padding: 1rem;
            font-size: 0.9rem;
        }

        footer a {
            color: #333;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<main>

    <img
        src="logo-pfotenverbunden.png"
        alt="Pfotenverbunden Logo"
        class="logo">

    <div class="description">
        Hundeaccessoires, handgemacht mit Liebe 🤍<br>
        Inspiriert von Charly &amp; Fritz
    </div>

    <a
        href="https://www.instagram.com/pfotenverbunden"
        target="_blank"
        rel="noopener noreferrer"
        class="instagram-button">
        👉 Zu Instagram
    </a>

</main>

<footer>
    <a href="Impressum.html">Impressum</a> |
    <a href="Datenschutz.html">Datenschutz</a>
</footer>

</body>
</html>
