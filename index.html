<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Pfotenverbunden – Instagram</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description" content="Pfotenverbunden – Folge uns auf Instagram.">
  <meta name="robots" content="index, follow">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fafafa;
      color: #333;
      text-align: center;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .logo {
      max-width: 320px;
      width: 80%;
      height: auto;
      margin-bottom: 1.5rem;
    }

    p {
      max-width: 420px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    a.button {
      display: inline-block;
      padding: 1rem 2.2rem;
      background: #E1306C;
      color: #fff;
      text-decoration: none;
      font-size: 1.1rem;
      border-radius: 8px;
      transition: background 0.2s ease;
    }

    a.button:hover {
      background: #c7255c;
    }

    footer {
      padding: 1rem;
      font-size: 0.9rem;
      background: #eee;
    }

    footer a {
      color: #333;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main>
    <!-- Logo -->
    <img 
      src="logo-pfotenverbunden.png" 
      alt="Pfotenverbunden Logo mit zwei Hunden und Pfote" 
      class="logo">

    <p>
  Hundeaccessoires, handgemacht mit Liebe 🤍<br>
  Inspiriert von Charly &amp; Fritz<br>
    </p>

    <a href="https://www.instagram.com/pfotenverbunden" class="button" target="_blank" rel="noopener">
      👉 Zu Instagram
    </a>
  </main>

  <footer>
    <a href="https://linktr.ee/pfotenverbunden" target="_blank" rel="noopener">
      Impressum
    </a>
  </footer>

</body>
</html>
